version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: drchat
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - drchat_data:/var/lib/postgresql/data   # <- volumen persistente

  user-service:
    build: .
    env_file:
      - .env
    ports:
      - "5002:5002"
    depends_on:
      - db
    volumes:
      - ./secrets/firebase-sa.json:/run/secrets/firebase-sa.json:ro

volumes:
  drchat_data:   # Docker crea este volumen named
