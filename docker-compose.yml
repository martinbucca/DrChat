services:
  # Database services
  
  postgres:
    image: postgres:17-alpine
    container_name: drchat-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=drchat
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d drchat"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drchat-network

  neo4j:
    image: neo4j:5.26.0-community
    container_name: drchat-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP interface
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drchat-network

  # Message broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: drchat-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drchat-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: drchat-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - drchat-network

  # Backend services

  file-service:
    build:
      context: ./backend/ingestion/file-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"  
    env_file:
      - ./.env
    environment:
      - STORAGE_DIR=/app/storage
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - drchat-network
  
  document-processor-worker:
    build:
      context: ./backend/pipeline/document-processor-worker
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./storage:/app/storage
      - ./model_cache:/root/.cache/huggingface 
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - drchat-network
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  chat-history-service:
    build:
      context: ./backend/user/chat-history-service
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    env_file:
      - ./.env
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - drchat-network
    restart: unless-stopped

  chat-service:
    build:
      context: ./backend/user/chat-service
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - ./.env
    depends_on:
      neo4j:
        condition: service_healthy
      document-processor-worker:
        condition: service_started
    networks:
      - drchat-network
    restart: unless-stopped

  user-service:
    build:
      context: ./backend/user/user-service
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    env_file:
      - ./.env
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_CLOUD_PROJECT: ${FIREBASE_PROJECT_ID}
    volumes:
      - ./backend/user/user-service/secrets/firebase-sa.json:/run/secrets/firebase-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - drchat-network
    restart: unless-stopped

  # Frontend service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    env_file:
      - ./frontend/.env
    networks:
      - drchat-network

# Networks
networks:
  drchat-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local  
