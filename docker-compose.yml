services:
  # Database services
  
  mongodb:
    image: mongo:7.0
    container_name: drchat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - drchat-network

  # Backend services

  file-service:
    build:
      context: ./backend/ingestion/file-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"  
    env_file:
      - .env
    environment:
      - STORAGE_DIR=/app/storage
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - drchat-network
  
