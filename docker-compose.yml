  #     - ./backend/.env

  # entity-relation-extractor-worker:
  #   build:
  #     context: ./backend/pipeline/entity-relation-extractor-worker
  #     dockerfile: Dockerfile
  #   env_file:
  #     - ./backend/.env

  # chat-service:
  #   build:
  #     context: ./backend/user/chat-service
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8002:8000"
  #   env_file:
  #     - ./backend/.env

  # retriever-service:
  #   build:
  #     context: ./backend/user/retriever-service
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8003:8000"
  #   env_file:
  #     - ./backend/.env

  # Frontend service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5000:3000"
    networks:
      - drchat-network

# Networks
networks:
  drchat-network:
    driver: bridge

# Volumes
volumes:
  mongodb_data:
    driver: local  
