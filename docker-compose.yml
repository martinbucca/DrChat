services:
  # Database services
  
  mongodb:
    image: mongo:7.0
    container_name: drchat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - drchat-network

  neo4j:
    image: neo4j:5.15
    container_name: drchat-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP interface
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - drchat-network

  # Message broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: drchat-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    depends_on:
      - zookeeper
    networks:
      - drchat-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: drchat-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - drchat-network

  # Backend services

  file-service:
    build:
      context: ./backend/ingestion/file-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"  
    env_file:
      - ./.env
      - ./backend/ingestion/file-service/.env
    environment:
      - STORAGE_DIR=/app/storage
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    depends_on:
      - mongodb
      - kafka
    networks:
      - drchat-network
  
  document-processor-worker:
    build:
      context: ./backend/pipeline/document-processor-worker
      dockerfile: Dockerfile
    env_file:
      - ./.env
      - ./backend/pipeline/document-processor-worker/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - kafka
      - neo4j
    networks:
      - drchat-network
    restart: unless-stopped

